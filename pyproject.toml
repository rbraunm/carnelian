# SPDX-License-Identifier: MIT
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carnelian"
dynamic = ["version"]
description = "Sign-in for Python on the standard library alone: OpenID Connect, SAML 2.0, LDAP and SCIM 2.0."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["openid-connect", "oidc", "saml", "saml2", "ldap", "active-directory", "scim", "sign-in", "sso"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: System :: Systems Administration :: Authentication/Directory",
  "Topic :: System :: Systems Administration :: Authentication/Directory :: LDAP",
]
dependencies = []

[project.urls]
Source = "https://github.com/rbraunm/carnelian"
Issues = "https://github.com/rbraunm/carnelian/issues"

[project.optional-dependencies]
# Test oracles and the type checker: they check Carnelian and never run in an application.
test = [
  "pytest>=8",
  "cryptography>=44",
  "lxml>=5",
  "signxml>=4",
  "hypothesis>=6.170",
  "mypy>=2.4",
]

[tool.setuptools.packages.find]
include = ["carnelian*"]

[tool.setuptools.package-data]
carnelian = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "carnelian.version.softwareVersion"}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test*.py"]
python_functions = ["test*"]
