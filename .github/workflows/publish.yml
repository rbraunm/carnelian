# SPDX-License-Identifier: MIT
# Publishes to PyPI when a version tag (v<version>) is pushed on a commit of main, by PyPI's
# trusted publishing: no token is stored anywhere; PyPI trusts this workflow in the "pypi" environment.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Require the tag to be on main and to name the package's version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=$(python -c "import re; print(re.search(r'softwareVersion = \"([^\"]+)\"', open('carnelian/version.py').read()).group(1))")
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
